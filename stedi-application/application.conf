# STEDI application configuration.
#
# The rubric requires this file to declare the Kafka topic that the Spark join
# sinks to, and that the STEDI graph subscribes to. It is mounted into the
# stedi container by docker-compose.yaml and loaded with -Dconfig.file, so it is
# the configuration the running application actually uses.
#
# Resolution order inside the app (see KafkaConsumerUtil / JedisClient): the
# matching environment variable wins if set, otherwise these values are used.

suresteps{
  port=4567
}

redis{
  host=redis
  port=6379
  db=0
}

kafka{
  riskTopic=customer-risk
  broker="kafka:19092"
}

simplex=true
